name: Publish Court Decisions MCP to Registry

on:
  push:
    tags:
      - "court-registry-v*"

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'Ukraine-Territorial-MCP/court-decisions-mcp'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 \
            -o /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Validate manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate using GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish Court Decisions MCP
        run: ./mcp-publisher publish server.json
